name: Main

# Thin orchestrator over the shared workflows in metaplex-foundation/actions.
# Repository facts live in .github/.env (toolchain pins), .github/programs.json
# (program descriptors) and .github/file-filters.yml (change detection).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  changes:
    name: Detect changes
    uses: metaplex-foundation/actions/.github/workflows/detect-changes.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: read
      pull-requests: read

  build_programs:
    name: Programs
    if: needs.changes.outputs.any == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: read

  test_programs:
    name: Programs
    if: needs.changes.outputs.programs == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/test-programs.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: read
    with:
      program_matrix: ${{ needs.changes.outputs.program_matrix }}

  generate_clients:
    name: Generate clients
    if: needs.changes.outputs.any == 'true'
    needs: [changes, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/generate-clients.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: read

  test_js:
    name: JS Client
    if: needs.changes.outputs.js_client == 'true'
    needs: [changes, generate_clients]
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: read

  benchmark:
    name: Benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generate_clients
    uses: metaplex-foundation/actions/.github/workflows/benchmark.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    with:
      mode: store

  benchmark_summary:
    name: Benchmark Summary
    if: github.event_name == 'pull_request'
    needs: generate_clients
    uses: metaplex-foundation/actions/.github/workflows/benchmark.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    with:
      mode: summary

  build_rust_client:
    name: Rust Client
    if: needs.changes.outputs.rust_client == 'true'
    needs: [changes, generate_clients]
    uses: metaplex-foundation/actions/.github/workflows/build-rust-client.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: read
    with:
      features: --all-features

  test_rust_client:
    name: Rust Client
    if: needs.changes.outputs.rust_client == 'true'
    needs: [changes, generate_clients]
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@bd7d7c0172728cb8a81a5da228d6a59d2fb8db02 # v2.0.2
    permissions:
      contents: read
